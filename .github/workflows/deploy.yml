name: Deploy NPC PhotoSync to College Server

# Trigger workflow on push to main branch or manual trigger
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Connect to server via SSH and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 120s
        command_timeout: 60m
        script: |
          echo "=== 🚀 Starting NPC_PhotoSync Deployment ==="
          TARGET_DIR="/var/www/npc_photosync"

          # 1. ตรวจสอบโฟลเดอร์โปรเจกต์ หากยังไม่มีให้ clone มาไว้ที่ /var/www/npc_photosync
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory $TARGET_DIR does not exist. Cloning repository..."
            git clone https://github.com/basketballsiit-rgb/npc_photosync.git "$TARGET_DIR"
          fi

          cd "$TARGET_DIR"

          # System resources check
          echo "📊 System Resources:"
          free -h 2>/dev/null || true
          nproc 2>/dev/null || true

          # 2. ตั้งค่า Path สำหรับ Node.js (ตามโครงสร้างเดียวกับ npc_smartflow)
          if [ -d "/root/.nvm/versions/node/v20.20.2/bin" ]; then
            export PATH="/root/.nvm/versions/node/v20.20.2/bin:$PATH"
          fi

          # 3. ดึงโค้ดล่าสุดจาก GitHub
          echo "📥 Pulling latest changes from GitHub main branch..."
          OLD_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
          git fetch origin main
          git reset --hard origin/main
          NEW_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")

          # 4. ตรวจสอบไฟล์ .env บน Server
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "⚠️ .env not found, copying from .env.example..."
            cp .env.example .env
          fi

          # 5. ติดตั้ง Dependencies และ Generate Prisma Client
          echo "📦 Installing npm dependencies..."
          npm install --prefer-offline --no-audit --no-fund

          echo "🗄️ Generating Prisma Client & Syncing Database..."
          npx prisma generate
          npx prisma db push --accept-data-loss --skip-generate || true

          # 6. Build Next.js Production Assets (ข้ามเฉพาะเมื่อแก้ไฟล์ config/deploy และ .next/BUILD_ID พร้อมอยู่แล้ว)
          CHANGED_APP_FILES=""
          if [ -n "$OLD_SHA" ] && [ -n "$NEW_SHA" ]; then
            CHANGED_APP_FILES=$(git diff --name-only "$OLD_SHA" "$NEW_SHA" -- src/ prisma/ package.json package-lock.json next.config.mjs public/ 2>/dev/null || echo "FORCE_BUILD")
          else
            CHANGED_APP_FILES="FORCE_BUILD"
          fi

          if [ ! -f ".next/BUILD_ID" ] || [ -n "$CHANGED_APP_FILES" ]; then
            echo "⚡ Building Next.js application..."
            rm -rf .next/cache
            export NODE_OPTIONS="--max-old-space-size=2048"
            npm run build
          else
            echo "⚡ Only config/workflow files changed and .next/BUILD_ID exists — skipping redundant build!"
          fi

          # 7. จัดการสิทธิ์โฟลเดอร์อัปโหลดภาพ (SELinux & Permissions)
          echo "🔒 Setting directory permissions..."
          mkdir -p public/uploads/thumbnail public/uploads/report public/uploads/original
          chmod -R 777 public/uploads
          chcon -R -t httpd_sys_rw_content_t public/uploads 2>/dev/null || true

          # 8. รีสตาร์ตแอปพลิเคชันผ่าน PM2 (พอร์ต 3006)
          echo "🔄 Restarting Next.js server with PM2..."
          set +e

          # เคลียร์ process หรือ zombie เก่าที่ค้างอยู่บนพอร์ต 3006
          echo "🧹 Cleaning up lingering processes on port 3006..."
          fuser -k 3006/tcp 2>/dev/null || true
          lsof -ti:3006 | xargs kill -9 2>/dev/null || true

          # ล้างแคช Nginx Reverse Proxy (ถ้ามีบนดิสก์)
          rm -rf /var/cache/nginx/* 2>/dev/null || true

          if [ -d "/root/.nvm/versions/node/v20.20.2/bin" ]; then
            export PATH="/root/.nvm/versions/node/v20.20.2/bin:$PATH"
          fi

          if which pm2 > /dev/null 2>&1; then
            PM2_CMD="pm2"
          elif [ -x "/root/.nvm/versions/node/v20.20.2/bin/pm2" ]; then
            PM2_CMD="/root/.nvm/versions/node/v20.20.2/bin/pm2"
          else
            PM2_CMD="npx pm2"
          fi

          echo "Using PM2 command: $PM2_CMD"
          $PM2_CMD delete npc_photosync 2>/dev/null || true
          sleep 2
          fuser -k 3006/tcp 2>/dev/null || true
          $PM2_CMD start ecosystem.config.js || $PM2_CMD start npm --name npc_photosync -- start
          $PM2_CMD save

          # รีโหลด Nginx Reverse Proxy (ไม่เขียนทับไฟล์คอนฟิกเซิร์ฟเวอร์โดยพลการ)
          nginx -t 2>/dev/null && (nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null || true)

          # รอให้ Next.js เริ่มต้นการทำงาน
          sleep 8

          echo "=== PM2 STATUS ==="
          $PM2_CMD status

          echo "=== LISTENING PORTS ==="
          ss -tlpn 2>/dev/null | grep -E "3006|3005|nginx" || netstat -tlpn 2>/dev/null | grep -E "3006|3005|nginx" || true

          echo "=== LOCAL CURL PORT 3006 ==="
          curl -I -s --connect-timeout 5 http://127.0.0.1:3006/npc_photosync || echo "CURL to 127.0.0.1:3006 failed"
          curl -I -s --connect-timeout 5 http://127.0.0.1:3006/npc_photosync/admin || echo "CURL to 127.0.0.1:3006/admin failed"

          echo "=== PM2 RECENT LOGS ==="
          $PM2_CMD logs npc_photosync --lines 30 --nostream
          $PM2_CMD logs npc_photosync --err --lines 30 --nostream

          echo "✅ Deploy NPC PhotoSync สำเร็จเรียบร้อยแล้ว!"
