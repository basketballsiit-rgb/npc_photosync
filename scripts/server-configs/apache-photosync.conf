# ==============================================================================
# Apache Reverse Proxy Configuration for NPC_PhotoSync
# Place in: /etc/httpd/conf.d/npc_photosync.conf (RHEL/CentOS/AlmaLinux)
# or /etc/apache2/sites-available/npc_photosync.conf (Debian/Ubuntu)
# ==============================================================================

# Option A: ซับโดเมนเฉพาะ เช่น photosync.nanpoly.ac.th
<VirtualHost *:80>
    ServerName photosync.nanpoly.ac.th
    ServerAdmin admin@nanpoly.ac.th

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3005/
    ProxyPassReverse / http://127.0.0.1:3005/

    # Forward headers for HTTPS & Client IP
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # Max upload size (100MB+ for high-res photos)
    LimitRequestBody 104857600

    ErrorLog /var/log/httpd/npc_photosync_error.log
    CustomLog /var/log/httpd/npc_photosync_access.log combined
</VirtualHost>

# Option B: ซับพาธร่วมกับโดเมนหลัก เช่น http://server-ip/photosync/
# RewriteEngine On
# ProxyPass /photosync http://127.0.0.1:3005
# ProxyPassReverse /photosync http://127.0.0.1:3005
