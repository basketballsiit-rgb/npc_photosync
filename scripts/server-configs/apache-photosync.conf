# ==============================================================================
# Apache Reverse Proxy Configuration for service.npc.ac.th
# สำหรับเชื่อมโยง http://service.npc.ac.th/npc_photosync -> Next.js พอร์ต 3006
#
# นำไปใส่ในไฟล์คอนฟิก Apache ของ service.npc.ac.th
# เช่น /etc/httpd/conf.d/service.npc.ac.th.conf (หรือ ssl.conf / vhost)
# ==============================================================================

# เพิ่มคำสั่ง ProxyPass ภายในบล็อก <VirtualHost *:80> หรือ <VirtualHost *:443> ของ service.npc.ac.th:

ProxyPreserveHost On

# Route traffic for /npc_photosync to Node.js / Next.js at port 3006
ProxyPass /npc_photosync/ http://127.0.0.1:3006/npc_photosync/
ProxyPassReverse /npc_photosync/ http://127.0.0.1:3006/npc_photosync/

ProxyPass /npc_photosync http://127.0.0.1:3006/npc_photosync
ProxyPassReverse /npc_photosync http://127.0.0.1:3006/npc_photosync

# WebSocket / HMR support for Next.js
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/npc_photosync/(.*) ws://127.0.0.1:3006/npc_photosync/$1 [P,L]

# รองรับการอัปโหลดไฟล์ภาพความละเอียดสูง (100MB+)
LimitRequestBody 104857600
RequestHeader set X-Forwarded-Proto "http"
